<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DeepSign — Türk İşaret Dili gerçek zamanlı yapay zeka çeviri sistemi">
    <title>DeepSign — Türk İşaret Dili</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container">

    <!-- ── Header ───────────────────────── -->
    <header class="header">
        <div class="header-brand">
            <div class="header-text">
                <h1>DeepSign — Türk İşaret Dili</h1>
                <p class="sub">Gerçek Zamanlı Yapay Zeka Çevirisi</p>
            </div>
        </div>
        <div class="header-badge">
            <span class="dot"></span>
            Canlı
        </div>
    </header>

    <!-- ── Main ─────────────────────────── -->
    <main class="main-content">

        <!-- Sol: Video + Cümle -->
        <div class="video-section">

            <!-- Video + durum halkası -->
            <div class="video-wrapper">
                <div class="status-ring idle" id="statusRing"></div>

                <div class="video-container">
                    <img id="videoFeed"
                         src="{{ url_for('video_feed') }}"
                         alt="Kamera akışı">

                    <!-- Video üstü durum etiketi -->
                    <div class="video-badge idle" id="videoBadge">
                        <span class="badge-dot" id="badgeDot"></span>
                        <span id="badgeLabel">Bekliyor</span>
                    </div>

                    <div class="video-overlay" id="videoOverlay">
                        <span class="loading-text">📷 Kamera bağlanıyor…</span>
                    </div>
                </div>
            </div>

            <!-- Cümle alanı -->
            <div class="sentence-section">
                <div class="sentence-header">
                    <span class="sentence-icon">💬</span>
                    <h3>Oluşturulan Cümle</h3>
                </div>
                <div class="sentence-body" id="sentenceContainer">
                    <span class="empty-sentence">Tahminlere tıklayın veya 1 / 2 / 3 gösterin</span>
                </div>
            </div>

        </div>

        <!-- Sağ: Tahmin paneli -->
        <div class="predictions-panel">

            <div class="panel-header">
                <h2>🎯 Tespit Edilen Kelimeler</h2>
            </div>

            <!-- Tahmin kartları -->
            <div class="panel-body" id="predictionsList">

                <div class="prediction-item prediction-1" id="predItem0" data-index="0">
                    <span class="prediction-rank">#1</span>
                    <span class="prediction-label" id="pred1Label">1. —</span>
                    <div class="prediction-bar-container">
                        <div class="prediction-bar" id="pred1Bar"></div>
                    </div>
                    <div class="prediction-footer">
                        <span class="prediction-confidence" id="pred1Conf">%0</span>
                        <span class="prediction-hint">tıkla veya 1 göster</span>
                    </div>
                </div>

                <div class="prediction-item prediction-2" id="predItem1" data-index="1">
                    <span class="prediction-rank">#2</span>
                    <span class="prediction-label" id="pred2Label">2. —</span>
                    <div class="prediction-bar-container">
                        <div class="prediction-bar" id="pred2Bar"></div>
                    </div>
                    <div class="prediction-footer">
                        <span class="prediction-confidence" id="pred2Conf">%0</span>
                        <span class="prediction-hint">tıkla veya 2 göster</span>
                    </div>
                </div>

                <div class="prediction-item prediction-3" id="predItem2" data-index="2">
                    <span class="prediction-rank">#3</span>
                    <span class="prediction-label" id="pred3Label">3. —</span>
                    <div class="prediction-bar-container">
                        <div class="prediction-bar" id="pred3Bar"></div>
                    </div>
                    <div class="prediction-footer">
                        <span class="prediction-confidence" id="pred3Conf">%0</span>
                        <span class="prediction-hint">tıkla veya 3 göster</span>
                    </div>
                </div>

            </div>

            <!-- Kontrol butonları -->
            <div class="control-buttons">
                <button class="btn btn-secondary" id="clearPredictions">
                    🗑 Tahminleri Temizle
                </button>
                <button class="btn btn-danger" id="clearSentence">
                    ✕ Cümleyi Temizle
                </button>
                <button class="btn btn-primary" id="speakSentence">
                    🔊 Seslendir
                </button>
            </div>

        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
